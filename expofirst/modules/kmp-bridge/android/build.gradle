plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}


group = 'expo.modules.kmpbridge'
version = '0.1.0'

repositories {
  mavenLocal()  // resolves the KMP `shared` module published via `./gradlew publishToMavenLocal`
  mavenCentral()
  google()
}

dependencies {
  // KMP shared module (commonMain + androidMain), consumed as a normal AAR.
  // Gradle Module Metadata selects the `shared-android` variant automatically.
  implementation 'com.example.shared:shared:1.0.0'
}

android {
  namespace "expo.modules.kmpbridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
